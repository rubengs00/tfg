<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/">
      <span class="brand__mark">M</span>
      <span>MusicHub</span>
    </a>

    <nav class="sidebar__nav">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        <lucide-icon [img]="icons.Home" [size]="19"></lucide-icon>
        Inicio
      </a>
      <a routerLink="/favorites" routerLinkActive="is-active">
        <lucide-icon [img]="icons.Heart" [size]="19"></lucide-icon>
        Favoritas
      </a>
      <a routerLink="/playlists" routerLinkActive="is-active">
        <lucide-icon [img]="icons.ListMusic" [size]="19"></lucide-icon>
        Playlists
      </a>
      <a routerLink="/profile" routerLinkActive="is-active">
        <lucide-icon [img]="icons.UserRound" [size]="19"></lucide-icon>
        Perfil
      </a>
      @if (auth.isAdmin()) {
        <a routerLink="/admin" routerLinkActive="is-active">
          <lucide-icon [img]="icons.LayoutDashboard" [size]="19"></lucide-icon>
          Admin
        </a>
      }
    </nav>
  </aside>

  <section class="main-panel">
    <header class="topbar">
      <form class="search-box" (ngSubmit)="submitSearch()">
        <lucide-icon [img]="icons.Search" [size]="18"></lucide-icon>
        <input
          name="search"
          [(ngModel)]="search"
          placeholder="Buscar artistas, albumes o canciones..."
          autocomplete="off"
        />
      </form>

      <div class="topbar__actions">
        @if (auth.user(); as user) {
          <a class="user-chip" routerLink="/profile">
            <span class="user-chip__avatar">
              @if (user.avatarUrl) {
                <img [src]="user.avatarUrl" [alt]="user.name" />
              } @else {
                <span>{{ user.name.charAt(0) || 'U' }}</span>
              }
            </span>
            <span>{{ user.name }}</span>
          </a>
          <button class="icon-button" type="button" (click)="logout()" title="Cerrar sesion">
            <lucide-icon [img]="icons.LogOut" [size]="18"></lucide-icon>
          </button>
        } @else {
          <a class="ghost-button" routerLink="/register">Registro</a>
          <a class="primary-button" routerLink="/login">
            <lucide-icon [img]="icons.LogIn" [size]="18"></lucide-icon>
            Login
          </a>
        }
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </section>
</div>

<app-audio-player />
