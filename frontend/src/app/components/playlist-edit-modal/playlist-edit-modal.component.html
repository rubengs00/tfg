<div class="spotify-modal-overlay" (click)="close()">
  <div class="spotify-modal" (click)="$event.stopPropagation()">
    <div class="edit-header">
      <h2>Editar informacion</h2>
      <button class="close-btn" type="button" (click)="close()" aria-label="Cerrar">
        &times;
      </button>
    </div>

    <div class="edit-body">
      <div class="edit-image-block">
        @if (coverPreview(); as cover) {
          <img [src]="cover" [alt]="name" class="edit-image" />
        } @else {
          <div class="edit-image edit-image--fallback">{{ coverInitial() }}</div>
        }

        <label class="image-picker" [class.is-disabled]="loading()">
          Elegir foto
          <input
            type="file"
            accept="image/*"
            (change)="onFileSelected($event)"
            [disabled]="loading()"
            hidden
          />
        </label>
      </div>

      <div class="edit-fields">
        <input [(ngModel)]="name" placeholder="Nombre" [disabled]="loading()" />
        <textarea
          [(ngModel)]="description"
          placeholder="Descripcion"
          [disabled]="loading()"
        ></textarea>

        @if (error(); as message) {
          <p class="modal-error">{{ message }}</p>
        }
      </div>
    </div>

    <div class="edit-footer">
      <button class="save-btn" type="button" (click)="save()" [disabled]="loading() || !name.trim()">
        {{ loading() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </div>
</div>
